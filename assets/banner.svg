<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes shimmer {
        0% { stop-color: #818cf8; }
        50% { stop-color: #38bdf8; }
        100% { stop-color: #c084fc; }
      }
      .node-pulse {
        animation: pulse 4s infinite ease-in-out;
        transform-origin: center;
      }
      .floating-card {
        animation: float 6s infinite ease-in-out;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
    <line x1="640" y1="0" x2="640" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="960" y1="0" x2="960" y2="400" />
    <line x1="1120" y1="0" x2="1120" y2="400" />
  </g>

  <!-- Animated Glowing Dynamic Background Nodes -->
  <circle cx="1080" cy="120" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="node-pulse" />
  <circle cx="200" cy="300" r="140" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="node-pulse" />

  <!-- Decorative Tech Graphic / Connecting Nodes -->
  <g stroke="rgba(192, 132, 252, 0.25)" stroke-width="2" fill="none">
    <path d="M 900 120 L 980 180 L 1100 140 L 1180 220" />
    <path d="M 980 180 L 1020 280 L 1140 290" />
  </g>
  <circle cx="900" cy="120" r="6" fill="#818cf8" />
  <circle cx="980" cy="180" r="8" fill="#c084fc" class="node-pulse" />
  <circle cx="1100" cy="140" r="6" fill="#38bdf8" />
  <circle cx="1180" cy="220" r="7" fill="#818cf8" />
  <circle cx="1020" cy="280" r="6" fill="#c084fc" />
  <circle cx="1140" cy="290" r="8" fill="#38bdf8" class="node-pulse" />

  <!-- Content Group -->
  <g transform="translate(80, 0)">
    <!-- Top Pill / Category -->
    <g transform="translate(0, 70)">
      <rect width="260" height="34" rx="17" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
      <text x="130" y="22" text-anchor="middle" class="badge-text" fill="#a5b4fc">⚡ AWESOME ARCHITECTURE ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title-text" font-size="46" letter-spacing="-0.5">Awesome Service Catalog Platform</text>
    <rect x="0" y="182" width="620" height="4" rx="2" fill="url(#accent-grad)" />

    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle-text" font-size="20">
      Curated directory of Internal Developer Portals, Software Catalogs &amp; Scorecards
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 270)">
      <!-- Badge 1 -->
      <g class="floating-card">
        <rect x="0" y="0" width="160" height="44" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="80" y="27" text-anchor="middle" class="badge-text">📊 Scorecards</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(175, 0)" class="floating-card">
        <rect x="0" y="0" width="180" height="44" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="90" y="27" text-anchor="middle" class="badge-text">🚀 SaaS &amp; OSS</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(370, 0)" class="floating-card">
        <rect x="0" y="0" width="200" height="44" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="100" y="27" text-anchor="middle" class="badge-text">🛠️ Developer Portals</text>
      </g>
    </g>
  </g>
</svg>
